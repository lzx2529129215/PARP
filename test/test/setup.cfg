[metadata]
name = memsched-exp
version = 0.3.0
description = Kernel-independent, auditable Linux memory experiment collection and paired analysis
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = memsched_exp*

[options.entry_points]
console_scripts =
    memsched-exp = memsched_exp.cli:main
    memsched-report = memsched_exp.report:main
    memsched-compare = memsched_exp.compare:main
    memsched-manifest = memsched_exp.schema:main
    memsched-cache-state = memsched_exp.cache_state:main
    memsched-policy-state = memsched_exp.policy_state:main
